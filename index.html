<style>
/* Layout : une colonne façon appli mobile, barre d'onglets fixe en bas */
:root{
  --bg:#F5F3F7; --surface:#FFFFFF; --soft:#ECE7F0; --line:#E3DDE8;
  --ink:#2A2630; --muted:#7A7383;
  --accent:#A3597A; --accent-soft:#F2E2EA; --on-accent:#FFFFFF;
  --up:#4E8A6E; --up-soft:#E0EDE6;
  --down:#B5584F; --down-soft:#F6E4E1;
  --gold:#A5791F; --gold-soft:#F5ECD6;
  --f-display:'Instrument Serif', Georgia, 'Times New Roman', serif;
  --f-body:'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --r:16px;
  --scrim:rgba(30,20,28,.38);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --scrim:rgba(0,0,0,.55);
  --bg:#17151A; --surface:#211E25; --soft:#2B2730; --line:#36313D;
  --ink:#EFEBF3; --muted:#A69FAF;
  --accent:#DB9BB6; --accent-soft:#3B2A33; --on-accent:#24161D;
  --up:#8FC4AA; --up-soft:#21312A;
  --down:#E8958C; --down-soft:#3B2523;
  --gold:#E2BE6E; --gold-soft:#3A311E; color-scheme:dark}}
:root[data-theme="dark"]{
  --scrim:rgba(0,0,0,.55);
  --bg:#17151A; --surface:#211E25; --soft:#2B2730; --line:#36313D;
  --ink:#EFEBF3; --muted:#A69FAF;
  --accent:#DB9BB6; --accent-soft:#3B2A33; --on-accent:#24161D;
  --up:#8FC4AA; --up-soft:#21312A;
  --down:#E8958C; --down-soft:#3B2523;
  --gold:#E2BE6E; --gold-soft:#3A311E; color-scheme:dark}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 120px;display:flex;flex-direction:column;gap:24px}
h1{font-family:var(--f-display);font-weight:400;font-size:2.35rem;line-height:1.02;margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 em,h2 em{font-style:italic;color:var(--accent)}
h2{font-family:var(--f-display);font-weight:400;font-size:1.55rem;line-height:1.1;margin:0;text-wrap:balance}
p{margin:0}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.section{display:flex;flex-direction:column;gap:12px}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrapf{flex-wrap:wrap}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.num{font-variant-numeric:tabular-nums}

.btn{appearance:none;border:0;font:inherit;font-weight:600;border-radius:999px;padding:12px 18px;cursor:pointer;background:var(--soft);color:var(--ink);text-align:center}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.ghost{background:transparent;color:var(--accent);padding:8px 6px}
.btn.danger{background:var(--down-soft);color:var(--down)}
.btn.sm{padding:7px 12px;font-size:.86rem}
.btn.full{width:100%}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

input,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
textarea{resize:vertical;min-height:72px}
input::placeholder,textarea::placeholder{color:var(--muted);opacity:.75}

/* Verdicts */
.pills{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.v{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.v b{font-weight:700;opacity:.8}
.v.up{background:var(--up-soft);color:var(--up)}
.v.eq{background:var(--soft);color:var(--muted)}
.v.down{background:var(--down-soft);color:var(--down)}
.v.rec{background:var(--gold-soft);color:var(--gold)}
.v svg{width:13px;height:13px}
.alert{display:flex;gap:8px;align-items:flex-start;border-radius:10px;padding:8px 10px;font-size:.86rem;line-height:1.35;color:var(--ink)}
.alert i{font-style:normal;font-weight:700;flex:none}
.alert.up{background:var(--up-soft)} .alert.up i{color:var(--up)}
.alert.down{background:var(--down-soft)} .alert.down i{color:var(--down)}
.alert.eq{background:var(--gold-soft)} .alert.eq i{color:var(--gold)}
.alerts{display:flex;flex-direction:column;gap:6px}
.cell{appearance:none;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:10px;padding:7px 4px;font:inherit;font-size:16px;font-weight:600;text-align:center;font-variant-numeric:tabular-nums;cursor:pointer;min-width:0;display:flex;flex-direction:column;align-items:center;line-height:1.15;min-height:40px;justify-content:center}
.cell.ph{color:var(--muted);font-weight:500;opacity:.75}
.cell small{font-size:.66rem;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.04em}
.cgrid .cell{width:100%}
#sheet{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
#sheet .panel{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;box-shadow:0 -8px 30px rgba(0,0,0,.15)}
#sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);align-self:center;margin-top:-8px}
.wheels{display:flex;gap:12px;justify-content:center}
.wheel-wrap{position:relative;flex:1 1 0;max-width:180px;display:flex;flex-direction:column;align-items:center;gap:4px}
.wheel-box{position:relative;width:100%;height:220px}
.wheel-box::before{content:"";position:absolute;left:0;right:0;top:88px;height:44px;border-radius:12px;background:var(--accent-soft);z-index:0}
.wheel{position:relative;z-index:1;height:220px;overflow-y:scroll;scroll-snap-type:y mandatory;padding-block:88px;scrollbar-width:none;-webkit-overflow-scrolling:touch;-webkit-mask-image:linear-gradient(to bottom,transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(to bottom,transparent,#000 30%,#000 70%,transparent)}
.wheel::-webkit-scrollbar{display:none}
.wi{height:44px;display:grid;place-items:center;scroll-snap-align:center;font-size:1.25rem;color:var(--muted);font-variant-numeric:tabular-nums;cursor:pointer;user-select:none}
.wi.on{color:var(--ink);font-weight:700;font-size:1.5rem}
.wunit{font-size:.72rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.kb{display:flex;gap:10px}
.kb label{flex:1}
.sheet-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.sheet-actions .wide{grid-column:1 / -1}
#rest{position:fixed;right:calc(16px + env(safe-area-inset-right,0px));bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:25;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#rest.dragging{opacity:.85;transform:scale(1.06)}
.rest-idle{appearance:none;border:0;width:58px;height:58px;border-radius:50%;background:var(--ink);color:var(--bg);box-shadow:0 6px 18px rgba(0,0,0,.22);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;font:inherit;cursor:pointer;line-height:1}
.rest-idle span{font-size:1.25rem}
.rest-idle b{font-size:.72rem;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.rest-btn{appearance:none;border:0;border-radius:999px;padding:12px 16px;font:inherit;font-weight:700;font-size:.92rem;background:var(--ink);color:var(--bg);box-shadow:0 6px 18px rgba(0,0,0,.18);cursor:pointer}
.rest-btn.done{background:var(--up);color:var(--surface)}
.rest-run{display:flex;align-items:center;gap:6px;background:var(--accent);border-radius:999px;padding:6px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.rest-run button{appearance:none;border:0;background:transparent;color:var(--on-accent);font:inherit;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:8px;padding:4px 8px}
.rest-run .plus15{background:var(--on-accent);color:var(--accent);border-radius:999px;font-size:.82rem;padding:6px 10px}
.rest-run b{font-size:1.15rem;font-variant-numeric:tabular-nums;min-width:3ch}
.rest-run svg{width:28px;height:28px;transform:rotate(-90deg)}
.rest-run .rt{fill:none;stroke:var(--on-accent);opacity:.3;stroke-width:3}
.rest-run .rp{fill:none;stroke:var(--on-accent);stroke-width:3;stroke-linecap:round}
.remind{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--gold-soft);border-radius:var(--r);padding:12px 14px}
.remind p{flex:1 1 200px;font-size:.9rem;color:var(--ink)}
.remind .btn{background:var(--surface);color:var(--gold)}
.bk{display:flex;flex-direction:column;gap:10px}
.bk-status{display:flex;align-items:center;gap:10px;font-size:.9rem}
.bk-status i{flex:none;width:10px;height:10px;border-radius:50%;background:var(--up)}
.bk-status i.late{background:var(--gold)}
.file-btn{position:relative;overflow:hidden;display:block}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer;font-size:0}
.confirm{background:var(--accent-soft);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.cnts{display:inline-flex;gap:8px;font-size:.82rem;font-weight:600;font-variant-numeric:tabular-nums}
.cnt.up{color:var(--up)} .cnt.eq{color:var(--muted)} .cnt.down{color:var(--down)} .cnt.rec{color:var(--gold)}

/* Semaine */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.day{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:.75rem;color:var(--muted);font-weight:600}
.dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:.8rem;font-variant-numeric:tabular-nums}
.dot.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.dot.today{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent-soft)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{display:flex;flex-direction:column;gap:2px;padding:12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line)}
.stat b{font-family:var(--f-display);font-weight:400;font-size:1.9rem;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:.78rem;color:var(--muted);line-height:1.25}

.tpl{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;font:inherit;color:var(--ink);cursor:pointer}
.tpl > span:first-child{min-width:0}
.tpl strong{display:block;font-weight:600;font-size:1.02rem}
.tpl .muted{display:block;font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tpl .go{flex:none;width:34px;height:34px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700}
.resume{background:var(--accent-soft);border-color:transparent}

/* Éditeur */
.edit-head{display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:8px;z-index:5;margin-top:-8px}
.title-input{font-family:var(--f-display);font-size:2rem;border:0;background:transparent;padding:0;border-bottom:1px dashed var(--line);border-radius:0}
.field{display:flex;flex-direction:column;gap:5px;font-size:.76rem;color:var(--muted);font-weight:600}
.ex{display:flex;flex-direction:column;gap:10px}
.ex-head{display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.ex-title{font-weight:700;font-size:1.05rem;line-height:1.25;padding-top:4px}
.ex-kind{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.seg{display:inline-grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:999px;padding:3px;gap:2px;align-self:flex-start}
.seg button{appearance:none;border:0;background:transparent;font:inherit;font-size:.82rem;font-weight:600;color:var(--muted);padding:6px 12px;border-radius:999px;cursor:pointer}
.seg button.sel{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.reglage{font-size:15px;padding:7px 10px}
.ref{background:var(--bg);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.ref-l{font-size:.84rem;font-variant-numeric:tabular-nums;line-height:1.4}
.ref-l > span:first-child{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.sets{display:flex;flex-direction:column;gap:6px}
.set{display:grid;grid-template-columns:20px 16px minmax(0,1fr) 12px minmax(0,1fr) 32px 28px;gap:5px;align-items:center}
.set.pair{margin-top:4px}
.set-h{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:600}
.set-h span{text-align:center}
.set-n{font-size:.8rem;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.side{font-size:.74rem;font-weight:700;color:var(--accent);text-align:center}
.set input{text-align:center;padding:8px 4px;font-variant-numeric:tabular-nums}
.set .x{color:var(--muted);font-size:.8rem;text-align:center}
.mark{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--muted);width:32px;height:32px;border-radius:50%;cursor:pointer;font:inherit;font-weight:700;font-size:.95rem;line-height:1;padding:0}
.mark.plus{background:var(--up-soft);color:var(--up);border-color:transparent}
.mark.minus{background:var(--down-soft);color:var(--down);border-color:transparent}
.icon-btn{appearance:none;border:0;background:transparent;color:var(--muted);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:1.1rem;line-height:1;display:grid;place-items:center;padding:0}
.icon-btn:hover{background:var(--soft)}
.ex-actions{display:flex;flex-wrap:wrap;gap:6px}
.live{border-top:1px dashed var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.live .eyebrow{font-size:.66rem}
.cgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.cgrid input{text-align:center;font-variant-numeric:tabular-nums}
.pgroup{display:flex;flex-direction:column;gap:8px}
.picks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.pick{appearance:none;display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;font-weight:600;font-size:.9rem;color:var(--ink);cursor:pointer;min-width:0}
.pick span{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:.8rem}
.pick .plus{background:var(--accent-soft);color:var(--accent)}
.pick.done{background:var(--soft);border-color:transparent;color:var(--muted)}
.pick.done .ok{background:var(--up-soft);color:var(--up)}
.picker{border:1px dashed var(--line);background:transparent}
.add-row{display:flex;gap:8px}
.feel{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.feel button{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;padding:10px 2px;font:inherit;font-size:.76rem;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.feel button b{font-family:var(--f-display);font-weight:400;font-size:1.4rem;line-height:1}
.feel button.sel{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}

/* Journal et détail */
.month{margin-top:6px}
.sess{display:flex;gap:14px;align-items:center;width:100%;text-align:left;font:inherit;color:var(--ink);cursor:pointer}
.sess .date{flex:none;width:46px;text-align:center;display:flex;flex-direction:column;line-height:1.05}
.sess .date b{font-family:var(--f-display);font-weight:400;font-size:1.8rem;font-variant-numeric:tabular-nums}
.sess .date span{font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sess .info{min-width:0;flex:1;display:flex;flex-direction:column;gap:3px}
.sess .info strong{font-weight:600}
.item-d{display:flex;flex-direction:column;gap:6px;padding-block:12px;border-top:1px solid var(--line)}
.item-d:first-child{border-top:0;padding-top:0}
.item-d:last-child{padding-bottom:0}
.tag2{font-size:.72rem;color:var(--muted);font-weight:600}
.sets-line{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.9rem;line-height:1.5}
.note{font-size:.88rem;background:var(--accent-soft);border-radius:10px;padding:6px 10px;align-self:flex-start}

/* Progrès */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:.88rem;cursor:pointer;white-space:nowrap}
.chip.sel{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chart svg{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .axis{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.chart .l1{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart .l2{fill:none;stroke:var(--up);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart .a1{fill:var(--accent);opacity:.1}
.chart .p1{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .p2{fill:var(--surface);stroke:var(--up);stroke-width:2}
.chart .e1{fill:var(--accent)} .chart .e2{fill:var(--up)}
.chart .endlbl{fill:var(--ink);font-size:11px;font-weight:600;font-family:var(--f-body)}
.chart .bar{fill:var(--accent-soft)}
.chart .bar.now{fill:var(--accent)}
.chart .barlbl{fill:var(--ink);font-size:10px;font-weight:600;font-family:var(--f-body)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:0;border-top:2.2px solid var(--accent)}
.legend i.g2{border-top-color:var(--up)}
.hist{display:flex;flex-direction:column}
.hrow{display:flex;flex-direction:column;gap:4px;padding-block:10px;border-top:1px solid var(--line)}
.hrow:first-child{border-top:0}
.hrow .top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.howto p{font-size:.9rem;line-height:1.5}
details summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:.9rem}
details textarea{margin-top:8px;font-size:12px;min-height:110px}
.empty{text-align:center;padding:28px 18px;display:flex;flex-direction:column;gap:12px;align-items:center}

/* Barre d'onglets */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
#nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
#nav button{appearance:none;border:0;background:transparent;color:var(--muted);font:inherit;font-size:.7rem;font-weight:600;padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
#nav button svg{width:22px;height:22px}
#nav button[aria-current="page"]{color:var(--accent)}
#toast{position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.88rem;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){#toast{transition:none}}
</style>
</head>

    <button data-act="go" data-v="journal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3.5" width="14" height="17" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>Journal</button>
    <button data-act="go" data-v="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16"/><path d="M5 15l4-5 4 3 6-7"/></svg>Progrès</button>
    <button data-act="go" data-v="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Réglages</button>
  </div>
</nav>

  if (item.kind === "cardio"){ item.ph = f ? {min:fmt(f.item.min), kcal:fmt(f.item.kcal), level:fmt(f.item.level), speed:fmt(f.item.speed), incline:fmt(f.item.incline)} : {}; return; }
  item.sets.forEach(function(s,j){
    sidesOf(item).forEach(function(sd){
      var o = sd === "all" ? s : s[sd], p = null;
      if (f){ var ps = f.item.sets, q = ps[Math.min(j, ps.length-1)]; p = q ? (sd === "all" ? q : q[sd]) : null; }
      o.phKg = p && p.kg != null ? fmt(p.kg) : ""; o.phReps = p && isFinite(num(p.reps)) ? String(num(p.reps)) : ""; o.phAide = !!(p && p.aide);
    });
  });
}
function lastItemByName(name){
  var l = sorted(true);
  for (var i=0;i<l.length;i++) for (var j=0;j<l[i].items.length;j++) if (norm(l[i].items[j].name) === norm(name)) return l[i].items[j];
  return null;
}
function defaultMode(name){
  var m = null;
  Object.keys(TPL).forEach(function(t){ TPL[t].forEach(function(x){ if (!m && x[0] === "f" && norm(x[1]) === norm(name)) m = x[2]; }); });
  return m || "bi";
}
function newItem(kind, name, mode){
  var last = lastItemByName(name);
  if (kind === "cardio") return {id:uid(), kind:"cardio", name:name, reglage:last ? last.reglage||"" : "", min:last && last.min != null ? fmt(last.min) : "", kcal:"", level:last && last.level != null ? fmt(last.level) : "", speed:"", incline:"", note:""};
  var m = mode || (last ? last.mode : defaultMode(name)); if (!uniAllowed(name)) m = "bi";
  var n = last && last.mode === m ? last.sets.length : 4, sets = [];
  for (var i=0;i<n;i++) sets.push(blankSet(m));
  return {id:uid(), kind:"force", name:name, mode:m, reglage:last && last.mode === m ? last.reglage||"" : "", note:"", sets:sets};
}
function cloneForNew(it){
  if (it.kind === "cardio") return {id:uid(), kind:"cardio", name:it.name, reglage:it.reglage||"", min:it.min != null ? fmt(it.min) : "", kcal:"", level:it.level != null ? fmt(it.level) : "", speed:"", incline:"", note:""};
  return {id:uid(), kind:"force", name:it.name, mode:it.mode, reglage:it.reglage||"", note:"", sets:it.sets.map(function(){ return blankSet(it.mode); })};
}
function start(type){
  var items = TPL[type].filter(function(x){ return x[0] === "c"; }).map(function(x){ var it = newItem("cardio", x[1]); it.min = String(x[2]); return it; });
  S.draft = {id:uid(), created:Date.now(), date:today(), type:type, name:TYPES[type], feel:0, note:"", editing:false, items:items};
  var c = dctx(); items.forEach(function(it){ applyPh(it, c); });
  save(); go("edit");
}
function toDraft(s){
  var str = function(v){ return v == null ? "" : fmt(v); };
  var cp = function(o){ var r = {kg:str(o && o.kg), reps:o && o.reps != null ? String(o.reps) : "", mark:(o && o.mark)||""}; if (o && o.aide) r.aide = true; return r; };
  var d = {id:s.id, created:s.created, date:s.date, type:s.type||"libre", name:s.name, feel:s.feel||0, note:s.note||"", editing:true,
    items:s.items.map(function(it){
      if (it.kind === "cardio") return {id:it.id, kind:"cardio", name:it.name, reglage:it.reglage||"", min:str(it.min), kcal:str(it.kcal), level:str(it.level), speed:str(it.speed), incline:str(it.incline), note:it.note||""};
      return {id:it.id, kind:"force", name:it.name, mode:it.mode, reglage:it.reglage||"", note:it.note||"", noteOpen:!!it.note,
        sets:it.sets.map(function(x){ return it.mode === "uni" ? {g:cp(x.g), d:cp(x.d)} : cp(x); })};
    })};
  return d;
}

function refHTML(item, ctx){
  if (item.kind === "cardio") return '';
  var c = compareForce(item, ctx), h = '<div class="ref">';
  if (!c.prevItem) h += '<p class="ref-l">Première fois'+(item.mode === "uni" ? " en unilatéral" : "")+' : pas de séance d\'avant</p>';
  else h += '<p class="ref-l"><span>Séance d\'avant · '+esc(fmtShort(c.prevDate))+(c.loose ? ' · autre réglage'+(c.prevItem.reglage ? ' ('+esc(c.prevItem.reglage)+')' : '') : '')+'</span>'+setsSummary(c.prevItem)+'</p>';
  if (c.pb) h += '<p class="ref-l"><span>PB · '+(c.pb.date ? esc(fmtShort(c.pb.date)) : 'noté avant l\'appli')+(c.pb.reglage ? ' · '+esc(c.pb.reglage) : '')+'</span>'+setsSummary(c.pb)+'</p>';
  else if (!noPB(item)) h += '<p class="ref-l"><span>PB</span>Pas encore de PB : cette séance deviendra le premier.</p>';

}
function liveHTML(item, ctx){
  var h = '<span class="eyebrow">Aujourd\'hui</span>';
  if (item.kind === "cardio"){
    var r = compareCardio(item, ctx);
    if (!isFinite(r.cur.rate)) return h+'<span class="muted small">Remplis la durée et les kcal pour comparer.</span>';
    var p = pill(r.v);
    return h+'<div class="pills">'+(p || '<span class="muted small">Rien à comparer pour l\'instant</span>')+'<span class="muted small num">'+fmt(r.cur.rate)+' kcal/min</span></div>';
  }
  var c = compareForce(item, ctx);
  if (!c.sides.some(function(sd){ return sd.cur.n; })) return h+'<span class="muted small">Remplis tes séries pour voir si c\'est mieux, pareil ou moins bien.</span>';
  var out = '';
  c.sides.forEach(function(sd){
    if (!sd.cur.n) return;
    var lbl = sd.side !== "all" ? '<b>'+sideLbl(sd.side)+'</b> ' : '';

    out += '<div class="pills">'+line+'<span class="muted small num">volume '+fmtInt(sd.cur.vol)+' kg</span></div>';

function knownNames(){

}

function pickerHTML(d){
  var done = {}; d.items.forEach(function(it){ done[norm(it.name)] = true; });
  function btn(name){ var k = isCardio(name) ? "c" : "f", n = done[norm(name)];
    return '<button class="pick'+(n ? " done" : "")+'" data-act="add-quick" data-k="'+k+'" data-name="'+esc(name)+'">'+esc(name)+'<span class="'+(n ? "ok" : "plus")+'">'+(n ? "✓" : "+")+'</span></button>'; }
  function group(title, names){ return names.length ? '<div class="pgroup"><span class="eyebrow">'+esc(title)+'</span><div class="picks">'+names.map(btn).join("")+'</div></div>' : ''; }
  var CARD = ["Rameur","Tapis de marche","Elliptique"], used = {};
  CARD.concat(ABDOS).forEach(function(n){ used[norm(n)] = true; });
  var typeNames = function(t){ return TPL[t].filter(function(x){ return x[0] === "f"; }).map(function(x){ return x[1]; }); };
  var h = '<section class="card section picker" id="picker"><h2>Exercice <em>suivant</em></h2>', other = [];
  if (d.type !== "libre"){
    typeNames(d.type).forEach(function(n){ used[norm(n)] = true; });
    h += group(TYPES[d.type], typeNames(d.type));
  } else {
    ["jambes","push","dos"].forEach(function(t){ typeNames(t).forEach(function(n){ used[norm(n)] = true; }); h += group(TYPES[t], typeNames(t)); });
  }
  h += group("Cardio", CARD) + group("Abdos", ABDOS);
  knownNames().forEach(function(n){ if (!used[norm(n)]) other.push(n); });
  if (other.length) h += d.type !== "libre" ? '<details><summary>Autres exercices</summary><div class="picks" style="margin-top:8px">'+other.map(btn).join("")+'</div></details>' : group("Autres", other);

  h += '<datalist id="exList">'+knownNames().map(function(n){ return '<option value="'+esc(n)+'">'; }).join("")+'</datalist></section>';
  return h;
}

/* ---------- progrès ---------- */
function nice(lo, hi){
  if (lo === hi){ lo = lo*0.8; hi = hi*1.2 || 1; }
  var span = hi-lo, raw = span*1.25/4, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw/p;
  var step = (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p;
  var a = Math.max(0, Math.floor((lo-span*0.1)/step)*step), b = Math.ceil((hi+span*0.1)/step)*step, t = [];
  for (var v=a; v<=b+step/2; v+=step) t.push(Math.round(v*100)/100);
  return t;
}
function lineChart(pts, series){
  var W=340,H=190,L=36,R=40,T=14,B=26;
  var xs = pts.map(function(p){ return parseISO(p.date).getTime(); }), x0 = Math.min.apply(null,xs), x1 = Math.max.apply(null,xs);
  if (x0 === x1){ x0 -= 3*864e5; x1 += 3*864e5; }
  var vals = []; series.forEach(function(s){ pts.forEach(function(p){ if (isFinite(p[s.k]) && p[s.k] > 0) vals.push(p[s.k]); }); });
  if (!vals.length) return '';
  var ticks = nice(Math.min.apply(null,vals), Math.max.apply(null,vals)), y0 = ticks[0], y1 = ticks[ticks.length-1];
  function X(t){ return L + (t-x0)/(x1-x0)*(W-L-R); }
  function Y(v){ return T + (1-(v-y0)/(y1-y0))*(H-T-B); }
  var g = '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Évolution">';
  ticks.forEach(function(t){ g += '<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(t).toFixed(1)+'" y2="'+Y(t).toFixed(1)+'"/><text class="axis" x="'+(L-6)+'" y="'+(Y(t)+3.5).toFixed(1)+'" text-anchor="end">'+fmt(t)+'</text>'; });
  var idx = pts.length > 2 ? [0, Math.floor((pts.length-1)/2), pts.length-1] : pts.map(function(_,i){ return i; });
  idx.forEach(function(i,n){ var a = n === 0 ? "start" : (i === pts.length-1 ? "end" : "middle"); g += '<text class="axis" x="'+X(xs[i]).toFixed(1)+'" y="'+(H-8)+'" text-anchor="'+a+'">'+esc(parseISO(pts[i].date).toLocaleDateString("fr-FR",{day:"numeric",month:"short"}))+'</text>'; });
  var ends = [];
  series.forEach(function(s, si){

  if (!restPos) return;
  var w = restEl.offsetWidth || 58, h = restEl.offsetHeight || 58, vw = window.innerWidth, vh = window.innerHeight;
  restPos.l = Math.max(8, Math.min(vw - w - 8, restPos.l)); restPos.t = Math.max(8, Math.min(vh - h - 8, restPos.t)); placeRest();
}
restEl.addEventListener("pointerdown", function(e){
  var rc = restEl.getBoundingClientRect();
  drag = {x:e.clientX, y:e.clientY, l:rc.left, t:rc.top, moved:false, id:e.pointerId, timer:setTimeout(function(){ if (drag){ drag.moved = true; restEl.classList.add("dragging"); } }, 350)};
});
window.addEventListener("pointermove", function(e){
  if (!drag) return;
  var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.abs(dx) + Math.abs(dy) > 8){ drag.moved = true; restEl.classList.add("dragging"); }
  if (!drag.moved) return;
  e.preventDefault();
  restPos = {l:drag.l + dx, t:drag.t + dy}; clampRest();
});
function endDrag(){
  if (!drag) return; clearTimeout(drag.timer);
  if (drag.moved){ dragClick = true; setTimeout(function(){ dragClick = false; }, 400); try { localStorage.setItem(RPOS, JSON.stringify(restPos)); } catch(e){} }
  restEl.classList.remove("dragging"); drag = null;
}
window.addEventListener("pointerup", endDrag);
window.addEventListener("pointercancel", endDrag);
restEl.addEventListener("click", function(e){ if (dragClick){ e.stopPropagation(); e.preventDefault(); dragClick = false; } }, true);
restEl.addEventListener("contextmenu", function(e){ e.preventDefault(); });
window.addEventListener("resize", clampRest);
placeRest();

var VIEWS = {home:vHome, edit:vEdit, journal:vJournal, detail:vDetail, progress:vProgress, settings:vSettings};
function render(){
  $("#app").innerHTML = VIEWS[view]();
  var tab = view === "detail" ? "journal" : view;
  document.querySelectorAll("#nav button").forEach(function(b){ if (b.dataset.v === tab) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current"); });
  if (typeof buildRest === "function" && restEl) buildRest();
}

/* ---------- enregistrement ---------- */
function cl(o){ var r = num(o && o.reps); if (!(r > 0)) return null; var k = num(o.kg); var x = {kg:isFinite(k) ? k : 0, reps:Math.round(r), mark:o.mark||""}; if (o.aide) x.aide = true; return x; }
function finalize(d){
  var items = [];
  d.items.forEach(function(it){
    if (it.kind === "cardio"){
      var o = {id:it.id, kind:"cardio", name:it.name, reglage:(it.reglage||"").trim(), min:numOrNull(it.min), kcal:numOrNull(it.kcal), level:numOrNull(it.level), speed:numOrNull(it.speed), incline:numOrNull(it.incline), note:(it.note||"").trim()};
      if (o.min != null || o.kcal != null) items.push(o); return;
    }
    var sets = [], E = {kg:null, reps:null, mark:""};
    it.sets.forEach(function(s){
      if (it.mode === "uni"){ var g = cl(s.g), dd = cl(s.d); if (g || dd) sets.push({g:g||E, d:dd||E}); }
      else { var c = cl(s); if (c) sets.push(c); }
    });
    if (sets.length) items.push({id:it.id, kind:"force", name:it.name, mode:it.mode, reglage:(it.reglage||"").trim(), note:(it.note||"").trim(), sets:sets});
  });
  return items;
}
function saveSession(){
  var d = S.draft, items = finalize(d);
  if (!items.length){ toast("Remplis au moins une série ou un cardio avant d'enregistrer."); return; }
  var rec = {id:d.id, created:d.created || Date.now(), date:d.date || today(), type:d.type||"libre", name:(d.name||"").trim() || "Séance", feel:+d.feel || 0, note:(d.note||"").trim(), items:items};
  var i = S.sessions.findIndex(function(s){ return s.id === d.id; });
  if (i >= 0) S.sessions[i] = rec; else S.sessions.push(rec);
  updatePBs(rec);
  S.draft = null; save();
  var c = sessionSummary(rec);
  detailId = rec.id; go("detail");
  var parts = []; if (c.up) parts.push(c.up+" mieux"); if (c.eq) parts.push(c.eq+" pareil"); if (c.down) parts.push(c.down+" moins bien"); if (c.rec) parts.push(c.rec+" PB");
  toast("Séance enregistrée"+(parts.length ? " : "+parts.join(", ") : ""));
}

/* ---------- événements ---------- */
var app = $("#app");
document.addEventListener("click", function(ev){
  var b = ev.target.closest("[data-act]"); if (!b) return;
  var a = b.dataset.act, d = S.draft, i = b.dataset.i != null ? +b.dataset.i : -1;
  prevKey = confirmKey; confirmKey = null;
  switch (a){
    case "go": pendingRestore = null; go(b.dataset.v); break;
    case "resume": go("edit"); break;
    case "start": if (S.draft) confirmOr("start-"+b.dataset.t, function(){ start(b.dataset.t); }); else start(b.dataset.t); break;
    case "close-edit": save(); closeSheet(); go("home"); break;
    case "mode":
      var it = d.items[i], m = b.dataset.m; if (it.mode === m) break;
      it.sets = it.sets.map(function(s){
        if (m === "uni"){ var c = {kg:s.kg, reps:s.reps, mark:s.mark}; return {g:c, d:{kg:s.kg, reps:s.reps, mark:s.mark}}; }
        return {kg:s.g.kg, reps:s.g.reps, mark:s.g.mark};
      });
      it.mode = m; applyPh(it, dctx()); save(); rerender(); break;
    case "mark":
      var s = d.items[i].sets[+b.dataset.j], o = b.dataset.side === "all" ? s : s[b.dataset.side];
      o.mark = o.mark === "" || !o.mark ? "+" : o.mark === "+" ? "-" : "";
      b.textContent = o.mark === "+" ? "+" : o.mark === "-" ? "−" : "·";
      b.className = "mark "+(o.mark === "+" ? "plus" : o.mark === "-" ? "minus" : "");
      saveSoon(); break;
    case "add-set": d.items[i].sets.push(blankSet(d.items[i].mode)); applyPh(d.items[i], dctx()); save(); rerender(); break;
    case "rm-set": d.items[i].sets.splice(+b.dataset.j, 1); save(); rerender(); break;
    case "fill":
      var f = d.items[i];
      f.sets.forEach(function(s){ sidesOf(f).forEach(function(sd){ var o2 = sd === "all" ? s : s[sd]; if (o2.kg === "" && o2.phKg){ o2.kg = o2.phKg; if (o2.aide == null && o2.phAide) o2.aide = true; } if (o2.reps === "" && o2.phReps) o2.reps = o2.phReps; }); });
      save(); rerender(); break;
    case "variant":
      var src = d.items[i], nm = src.mode === "bi" && uniAllowed(src.name) ? "uni" : "bi";
      var nv = newItem("force", src.name, nm); nv.reglage = ""; nv.sets = [blankSet(nm),blankSet(nm),blankSet(nm),blankSet(nm)];
      applyPh(nv, dctx()); d.items.splice(i+1, 0, nv); save(); rerender(); break;
    case "note": d.items[i].noteOpen = true; rerender(); var nt = $("#nt-"+i); if (nt) nt.focus(); break;
    case "rm-item": confirmOr("rm-item-"+i, function(){ d.items.splice(i,1); save(); rerender(); }); break;
    case "add-quick":
      var q = newItem(b.dataset.k === "c" ? "cardio" : "force", b.dataset.name); applyPh(q, dctx()); d.items.push(q); save(); rerender();
      var lc = $("#it-"+(d.items.length-1)); if (lc) lc.scrollIntoView({block:"center"}); break;
    case "add-ex":
      var inp = $("#newEx"), n = inp.value.trim(); if (!n){ inp.focus(); break; }
      var ni = newItem(isCardio(n) ? "cardio" : "force", n); applyPh(ni, dctx()); d.items.push(ni); save(); rerender();
      var lc2 = $("#it-"+(d.items.length-1)); if (lc2) lc2.scrollIntoView({block:"center"}); break;
    case "feel": d.feel = String(d.feel) === b.dataset.n ? 0 : +b.dataset.n; save(); rerender(); break;
    case "save": saveSession(); break;
    case "discard": confirmOr("discard", function(){ var was = d.editing ? d.id : null; S.draft = null; save(); if (was){ detailId = was; go("detail"); } else go("home"); }); break;
    case "open": detailId = b.dataset.id; go("detail"); break;
    case "edit":
      var se = S.sessions.find(function(x){ return x.id === b.dataset.id; });
      S.draft = toDraft(se); var c2 = dctx(); S.draft.items.forEach(function(x){ applyPh(x, c2); }); save(); go("edit"); break;
    case "del": var id = b.dataset.id; confirmOr("del-"+id, function(){ S.sessions = S.sessions.filter(function(x){ return x.id !== id; }); save(); go("journal"); toast("Séance supprimée"); }); break;
    case "prog": progEx = b.dataset.name; rerender(); break;
    case "pick": openSetSheet(i, +b.dataset.j, b.dataset.side); break;
    case "pickc": openCardioSheet(i, b.dataset.f); break;
    case "sheet-close": closeSheet(); break;
    case "sheet-kb": sheetKb(); break;
    case "sheet-aide": if (sheet){ sheet.aide = b.dataset.v === "1"; b.parentNode.querySelectorAll("button").forEach(function(x){ x.classList.toggle("sel", x === b); }); } break;
    case "sheet-clear": sheetApply(true); break;
    case "sheet-ok": sheetApply(false); break;
    case "sheet-ok-rest": if (sheetApply(false)) startRest(); break;
    case "rest-start": startRest(); break;
    case "rest-plus": rest.end += 15000; rest.dur += 15000; tickRest(); break;
    case "rest-stop": stopRest(); break;
    case "backup": doBackup(); break;
    case "restore-ok": if (pendingRestore) applyRestore(pendingRestore); break;
    case "restore-cancel": pendingRestore = null; rerender(); break;
    case "set-pb":
      var sid = b.dataset.sid, iid = b.dataset.iid;
      confirmOr("set-pb-"+iid, function(){
        var ss = S.sessions.find(function(x){ return x.id === sid; }), it2 = ss && ss.items.find(function(x){ return x.id === iid; }); if (!it2) return;
        var pb = getPB(it2); if (!pb){ pb = {id:uid(), name:it2.name, mode:it2.mode, note:""}; S.pbs = S.pbs || []; S.pbs.push(pb); }
        pb.sets = clone(it2.sets); pb.date = ss.date; pb.reglage = it2.reglage; pb.sessionId = ss.id; pb.itemId = it2.id; pb.note = it2.note || "";
        save(); rerender(); toast("PB mis à jour");
      });
      break;
    case "copy":
      var txt = $("#bkText").value;
      var fb = function(){ var dt = $("#bkDetails"); dt.open = true; var ta = $("#bkText"); ta.focus(); ta.select(); toast("Sélectionne le texte et copie-le"); };
      try { navigator.clipboard.writeText(txt).then(function(){ markBackup(); toast("Sauvegarde copiée"); }, fb); } catch(err){ fb(); }
      break;
    case "restore":
      var raw = $("#restoreTxt").value.trim(); if (!raw){ toast("Colle d'abord le texte de sauvegarde."); break; }
      var data; try { data = JSON.parse(raw); } catch(err){ toast("Ce texte n'est pas une sauvegarde valide."); break; }
      if (!data || !Array.isArray(data.sessions)){ toast("Ce texte n'est pas une sauvegarde valide."); break; }
      confirmOr("restore", function(){ applyRestore(data); });
      var rt = $("#restoreTxt"); if (rt) rt.value = raw;
      break;
  }
});
app.addEventListener("input", function(ev){
  var t = ev.target, d = S.draft; if (!d) return;
  if (t.dataset.f){ d[t.dataset.f] = t.value; }
  else if (t.dataset.if){ d.items[+t.dataset.i][t.dataset.if] = t.value; if (t.dataset.if !== "note" && t.dataset.if !== "reglage") live(+t.dataset.i); }
  else if (t.dataset.k){ var s = d.items[+t.dataset.i].sets[+t.dataset.j], o = t.dataset.side === "all" ? s : s[t.dataset.side]; o[t.dataset.k] = t.value; live(+t.dataset.i); }
  saveSoon();
});
document.addEventListener("change", function(ev){
  var t = ev.target; if (t.id !== "restoreFile" || !t.files || !t.files[0]) return;
  var fr = new FileReader();
  fr.onload = function(){ var data = parseBackup(String(fr.result||"")); if (!data){ toast("Ce fichier n'est pas une sauvegarde valide."); return; } pendingRestore = data; rerender(); };
  fr.onerror = function(){ toast("Impossible de lire ce fichier."); };
  fr.readAsText(t.files[0]);
});
app.addEventListener("change", function(ev){
  var t = ev.target, d = S.draft; if (!d) return;
  if (t.dataset.if === "reglage" || t.dataset.f === "date"){ var c = dctx(); d.items.forEach(function(x){ applyPh(x, c); }); save(); rerender(); }
});

render();
})();
</script>
